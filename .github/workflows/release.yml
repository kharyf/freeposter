# Builds the Windows installer from a clean checkout and puts it on a draft GitHub Release.
# Start it by pushing a version tag that matches package.json:
#   npm version 1.0.0      (updates package.json and creates the tag v1.0.0)
#   git push --follow-tags
# Then review the draft under Releases and press Publish.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {} # nothing by default; the job asks for what it needs

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build attestation (Sigstore, no keys stored anywhere)
      attestations: write # store the attestation on GitHub
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to full commit hashes so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected). Use npm version to make tags."
            exit 1
          fi

      - name: Install ffmpeg (the tests render with it)
        run: choco install ffmpeg -y --no-progress

      - run: npm ci

      - run: npm run typecheck

      - name: Test
        # choco's PATH change only reaches later steps through refreshenv, so point at its shim folder directly.
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          ffmpeg -version | head -1
          npm test

      - name: Build installer
        run: npm run build:app

      - name: Checksums
        run: npm run checksums

      - name: Build attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/FreePoster-Setup-*.exe

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/FreePoster-Setup-*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "FreePoster $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            --draft
